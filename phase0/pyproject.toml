[project]
name = "sarae-phase0-tools"
version = "0.1.0"
description = "Phase 0 Digital Human feasibility: input validation and benchmark helpers (CPU only, no engine code)"
requires-python = ">=3.11,<3.13"
# The engines (LiveTalking, MuseTalk) get their own environments; this one never imports torch.
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
    "psutil>=5.9,<8",
    "nvidia-ml-py>=12.535",
]

[tool.uv]
package = false
