name: Sarae checks
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q backend/app backend/tools agent-core/src
      - name: Install gateway dependencies
        run: python -m pip install -r backend/requirements-gateway.txt pytest
      - name: Test gateway, admin page and CLI
        working-directory: backend
        run: python -m pytest -q tests
      - name: Install voice test dependencies
        run: python -m pip install obsws-python edge-tts
      - name: Test voice queue and providers
        env:
          PYTHONPATH: agent-core/src:agent-core/tests
        run: python -m pytest -q agent-core/tests/test_voice_queue.py agent-core/tests/test_voice_providers.py

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Studio UI dependencies
        run: npm ci --prefix desktop
      - name: Typecheck and build Studio UI
        run: npm run build --prefix desktop
      - name: Build the OBS overlay page (to a scratch folder)
        working-directory: desktop
        run: npx vite build --config vite.overlay.config.ts --outDir /tmp/overlay-check --emptyOutDir
      - name: Studio UI unit tests
        working-directory: desktop
        run: node --experimental-strip-types --test tests/*.test.ts
