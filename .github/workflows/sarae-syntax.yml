name: Sarae syntax guard
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q backend/app agent-core/src
      - name: Install Backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install Voice Engine test dependencies
        run: python -m pip install pytest obsws-python edge-tts
      - name: Test Voice Engine and LIVE reply integration with mock providers
        env:
          PYTHONPATH: backend:backend/tests:agent-core/src:agent-core/tests
        run: python -m pytest -q agent-core/tests/test_voice_queue.py agent-core/tests/test_voice_providers.py backend/tests/test_ai_live_reply.py backend/tests/test_voice_settings.py
      - name: Test TikTok Account contract
        env:
          PYTHONPATH: backend:backend/tests
        run: python -m unittest discover -s backend/tests -p test_tiktok_account_contract.py
      - name: Test Agent Cloud Media Cache (fake Cloud)
        env:
          PYTHONPATH: agent-core/src
        run: python -m unittest discover -s agent-core/tests -p test_cloud_media_cache.py
      - name: Test centralized Media Library (fake Google Drive)
        env:
          PYTHONPATH: backend:backend/tests
        run: python -m unittest discover -s backend/tests -p test_media_library.py

  web-tsx-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install standalone TSX parser
        run: npm install --global esbuild@0.25.12
      - name: Parse affected frontend files without bundling
        run: |
          esbuild web/src/LiveSessions.tsx web/src/LiveControl.tsx web/src/liveSessionsApi.ts desktop/src/features/tool/Settings.tsx --outdir=/tmp/sarae-syntax --format=esm

  web-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tooling
        run: npm install --global pnpm@10.15.0
      - name: Install Sarae Web dependencies
        run: npm ci --prefix web
      - name: Build Sarae Web
        run: npm run build --prefix web
