[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sarae-voice-server"
version = "0.1.0"
description = "Sarae TTS Backend: G-OmniVoice voice cloning service (FastAPI, one GPU worker)"
requires-python = ">=3.12,<3.13"
# torch==2.8.0 / torchaudio==2.8.0 (CUDA 12.8 wheels) are installed first by scripts/install.ps1.
dependencies = [
    "omnivoice==0.2.1",
    "transformers==5.14.1",
    "huggingface-hub>=0.35,<2.0",
    "soundfile>=0.12,<1",
    "numpy>=1.26,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "python-multipart>=0.0.20,<1",
    "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
bench = ["gradio_client>=1.0,<3", "faster-whisper>=1.1,<2", "psutil>=5.9"]

[project.scripts]
sarae-voice-server = "sarae_voice.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs the real G-OmniVoice model on CUDA (set SARAE_VOICE_GPU_TESTS=1)"]
